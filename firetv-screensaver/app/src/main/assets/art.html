<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #status { position: fixed; left: 3vw; bottom: 3vh; color: #777; font: 2.2vh sans-serif; }
</style>
</head>
<body>
<div id="status">Connecting to Home Assistant…</div>
<script>
// The app replaces the next line with {"url": ..., "token": ..., "entity": ...}.
const CONFIG = /*CONFIG*/null;

const status = document.getElementById('status');
let state = null;    // image entity state: the time the art was last re-rendered
let picture = null;  // /api/image_proxy/<entity>?token=..., the token rotates every 5 minutes
let shown = null;    // state of the art on screen
let retry = 1000;
let stopped = false;

// Load the new render off screen and swap it in once it has loaded, so the
// screen never flashes black between renders.
function show() {
  if (!picture || state === shown) return;
  const wanted = state;
  const next = new Image();
  next.onload = () => {
    if (wanted !== state) return; // a newer render is already loading
    document.querySelector('img')?.remove();
    document.body.prepend(next);
    shown = wanted;
    status.textContent = '';
  };
  next.onerror = () => { if (shown === null) status.textContent = `Couldn't load ${CONFIG.entity}`; };
  next.src = `${picture}&v=${encodeURIComponent(wanted)}`;
}

function update(event) {
  if (event.r?.includes(CONFIG.entity)) status.textContent = `${CONFIG.entity} was removed`;
  const changed = event.a?.[CONFIG.entity] ?? event.c?.[CONFIG.entity]?.['+'];
  if (!changed) return;
  if (changed.s !== undefined) state = changed.s;
  if (changed.a?.entity_picture) picture = changed.a.entity_picture;
  show();
}

function connect() {
  const ws = new WebSocket(`${CONFIG.url.replace(/^http/, 'ws')}/api/websocket`);
  const send = (message) => ws.send(JSON.stringify(message));
  ws.onmessage = ({ data }) => {
    const message = JSON.parse(data);
    switch (message.type) {
      case 'auth_required':
        send({ type: 'auth', access_token: CONFIG.token });
        break;
      case 'auth_ok':
        retry = 1000;
        if (shown === null) status.textContent = `Waiting for ${CONFIG.entity}…`;
        send({ id: 1, type: 'subscribe_entities', entity_ids: [CONFIG.entity] });
        break;
      case 'auth_invalid':
        stopped = true;
        status.textContent = 'Home Assistant rejected the access token';
        break;
      case 'result':
        if (!message.success) status.textContent = message.error.message;
        break;
      case 'event':
        update(message.event);
        break;
    }
  };
  // Keep the last art on screen while Home Assistant restarts or Wi-Fi drops.
  ws.onclose = () => {
    if (stopped) return;
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 60000);
  };
}

connect();
</script>
</body>
</html>
