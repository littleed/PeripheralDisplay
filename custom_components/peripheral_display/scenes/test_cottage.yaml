  - id: fog_near
    when: {signal: weather, is: fog}
    svg: <g fill="#f4f6f8" opacity="0.5" class="fog" style="animation-delay:-9s"><ellipse cx="800" cy="735" rx="1600" ry="60"/></g>

  - id: rain
    when: {signal: weather, in: [rain, storm]}
    svg: <g class="fall"><rect x="-1500" y="-1500" width="4600" height="4000" fill="url(#rain)"/></g>

  - id: rain_heavy
    when: {signal: weather, is: storm}
    svg: <g class="fall-fast"><rect x="-1500" y="-1500" width="4600" height="4000" fill="url(#rain)" transform="translate(60 40)"/></g>

  - id: snow
    when: {signal: weather, is: snow}
    svg: |
      <g class="fall-slow"><rect x="-1500" y="-1500" width="4600" height="4000" fill="url(#snow)"/></g>
      <g class="fall-mid" opacity="0.8"><rect x="-1500" y="-1500" width="4600" height="4000" fill="url(#snow)" transform="translate(50 30)"/></g>

  - id: lightning
    when: {signal: weather, is: storm}
    svg: <polygon points="430,180 395,305 422,305 382,440 456,282 428,282 458,180" fill="#fffbd0" class="flash"/>

  - id: gusts
    when: {signal: weather, in: [wind, storm]}
    svg: |
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
        <path class="gust" pathLength="100" d="M-40,250 C200,220 330,290 520,250 S820,200 980,250 C1080,280 1100,230 1060,215 C1030,205 1010,235 1040,245"/>
        <path class="gust" pathLength="100" style="animation-delay:-0.8s" d="M300,380 C500,350 650,410 860,370 S1200,330 1420,380 C1500,400 1520,350 1485,340 C1455,333 1445,362 1475,368"/>
        <path class="gust" pathLength="100" style="animation-delay:-1.6s" d="M-60,520 C150,500 300,550 480,515 S760,480 900,520"/>
        <path class="gust" pathLength="100" style="animation-delay:-1.2s" d="M1000,140 C1150,120 1280,170 1450,135 S1620,110 1700,140"/>
      </g>

  - id: leaves
    when: {signal: weather, in: [wind, storm]}
    svg: |
      <g fill="#c9822f">
        <ellipse cx="0" cy="450" rx="11" ry="5" class="leaf" style="animation-delay:-0.7s" fill="#d9a441"/>
        <ellipse cx="0" cy="700" rx="10" ry="4.5" class="leaf" style="animation-delay:-2s"/>
        <ellipse cx="0" cy="580" rx="9" ry="4" class="leaf" style="animation-delay:-3.2s" fill="#b5532a"/>
        <ellipse cx="0" cy="380" rx="11" ry="5" class="leaf"/>
        <ellipse cx="0" cy="520" rx="10" ry="4.5" class="leaf" style="animation-delay:-1.4s" fill="#9fb03a"/>
        <ellipse cx="0" cy="640" rx="11" ry="5" class="leaf" style="animation-delay:-2.6s"/>
        <ellipse cx="0" cy="300" rx="9" ry="4" class="leaf" style="animation-delay:-3.7s" fill="#d9a441"/>
        <ellipse cx="0" cy="760" rx="11" ry="5" class="leaf" style="animation-delay:-4.4s" fill="#9fb03a"/>
      </g>

  - id: vignette
    svg: <rect x="{{ view.x }}" y="{{ view.y }}" width="{{ view.width }}" height="{{ view.height }}" fill="url(#vignette)"/>
