# A test scene that exercises every standard signal.
#
#   weather  -> sky colour, sun, clouds, rain, lightning, snow, fog, wind
#   night    -> night palette, moon and stars, glowing windows
#   motion   -> a fox trots through the garden; the security lamp floods at night
#   doorbell -> a visitor at the door, the porch lamp lit and ringing
#   lights   -> windows light up in proportion to the lights that are on
#   heating  -> chimney smoke, denser with more heating
#   cinema   -> the snug window flickers with two viewers silhouetted
#   bin      -> the bin out for Friday's collection, in its colour
#   offline  -> the telephone wire snaps and sparks (a bird sits on it when online)
#   alert    -> a pigeon flies in with the matching headline on a banner
schema: peripheral-display/scene@1
id: test_cottage
name: Cottage in the Valley (test scene)
description: A cottage in a valley whose weather, windows, chimney, garden and lane reflect the home.
author: Peripheral Display
canvas: {width: 1600, height: 900}

signals:
  weather:
    type: enum
    label: Weather
    description: Sky, clouds and precipitation follow a weather entity's condition.
    options: [clear, partly, cloudy, rain, storm, snow, fog, wind]
    bind:
      source: map
      domains: [weather]
      map:
        clear: [sunny, clear-night]
        partly: [partlycloudy]
        cloudy: [cloudy, exceptional]
        rain: [rainy, pouring]
        storm: [lightning, lightning-rainy]
        snow: [snowy, snowy-rainy, hail]
        fog: [fog]
        wind: [windy, windy-variant]
  night:
    type: boolean
    label: Night
    description: Night palette, moon and stars.
    bind:
      source: state
      domains: [sun, binary_sensor, input_boolean]
      entities: [sun.sun]
      match: [below_horizon, "on"]
  motion:
    type: boolean
    label: Motion
    description: A fox in the garden while motion is detected, and for 2 minutes after.
    bind:
      source: state
      domains: [binary_sensor]
      hold: 120
  doorbell:
    type: boolean
    label: Doorbell
    description: A visitor at the door for a minute after a ring.
    bind:
      source: state
      domains: [binary_sensor, event]
      hold: 60
  lights:
    type: level
    label: Lights
    description: Windows light up with the share of lights that are on.
    bind:
      source: state
      domains: [light, switch]
  heating:
    type: level
    label: Heating
    description: Chimney smoke; denser as more of the heating is running.
    bind:
      source: state
      domains: [climate]
      attribute: hvac_action
      match: [heating]
  cinema:
    type: boolean
    label: Cinema
    description: The snug window flickers while a film plays.
    bind:
      source: state
      domains: [media_player]
      match: [playing]
  bin:
    type: enum
    label: Bin day
    description: The bin out for Friday's collection.
    options: [none, general, recycling, garden, food]
    bind:
      source: map
      domains: [sensor, calendar, input_select]
      compare: contains
      map:
        recycling: [recycl, blue]
        garden: [garden, green]
        food: [food, caddy]
        general: [general, refuse, rubbish, landfill, black]
  offline:
    type: boolean
    label: Internet offline
    description: The telephone wire snaps while connectivity sensors are off.
    bind:
      source: state
      domains: [binary_sensor]
      match: ["off", unavailable]
  alert:
    type: text
    label: Alert
    description: A pigeon carries the headline of a matching feed item for 6 hours.
    bind:
      source: event
      event_type: feedreader
      fields: [title, summary, description]
      text_field: title
      hold: 21600

vars:
  sky_top:
    - when: {all: [night, {signal: weather, in: [cloudy, rain, storm, snow, fog]}]}
      value: "#151a28"
    - {when: night, value: "#070b26"}
    - {when: {signal: weather, is: storm}, value: "#353d4b"}
    - {when: {signal: weather, in: [cloudy, rain]}, value: "#7f8c9b"}
    - {when: {signal: weather, in: [snow, fog]}, value: "#aab5c0"}
    - value: "#4fa3f7"
  sky_bottom:
    - when: {all: [night, {signal: weather, in: [cloudy, rain, storm, snow, fog]}]}
      value: "#2b3242"
    - {when: night, value: "#2e2b5e"}
    - {when: {signal: weather, is: storm}, value: "#5f6774"}
    - {when: {signal: weather, in: [cloudy, rain]}, value: "#c0c7cf"}
    - {when: {signal: weather, in: [snow, fog]}, value: "#e4e8ec"}
    - value: "#ffe2bf"
  far_hill:
    - {when: {all: [night, {signal: weather, is: snow}]}, value: "#6f7b96"}
    - {when: night, value: "#1c2742"}
    - {when: {signal: weather, is: snow}, value: "#dce3ea"}
    - {when: {signal: weather, in: [cloudy, rain, storm, fog]}, value: "#7d918a"}
    - value: "#8cbf9c"
  mid_hill:
    - {when: {all: [night, {signal: weather, is: snow}]}, value: "#8995ae"}
    - {when: night, value: "#16343a"}
    - {when: {signal: weather, is: snow}, value: "#eaeff4"}
    - {when: {signal: weather, in: [cloudy, rain, storm, fog]}, value: "#5e7f61"}
    - value: "#6aa86f"
  ground:
    - {when: {all: [night, {signal: weather, is: snow}]}, value: "#a9b4c9"}
    - {when: night, value: "#112b26"}
    - {when: {signal: weather, is: snow}, value: "#f9fbfc"}
    - {when: {signal: weather, in: [cloudy, rain, storm, fog]}, value: "#4e6e4b"}
    - value: "#5b9a50"
  path_color:
    - {when: night, value: "#3d3a44"}
    - {when: {signal: weather, is: snow}, value: "#d9dee4"}
    - value: "#d9c59b"
  tree:
    - {when: night, value: "#173229"}
    - {when: {signal: weather, in: [cloudy, rain, storm, fog]}, value: "#38663d"}
    - value: "#3f8046"
  tree_dark:
    - {when: night, value: "#10241e"}
    - value: "#2f6236"
  trunk:
    - {when: night, value: "#2a1f1b"}
    - value: "#6b4a32"
  wall:
    - {when: night, value: "#55536a"}
    - value: "#f2e6d2"
  wall_shade:
    - {when: night, value: "#47455a"}
    - value: "#e0d0b6"
  roof:
    - {when: night, value: "#3b2530"}
    - value: "#a24d3b"
  brick:
    - {when: night, value: "#3a2629"}
    - value: "#8d4b3c"
  door:
    - {when: night, value: "#2e211d"}
    - value: "#5b3b2a"
  frame:
    - {when: night, value: "#2a2430"}
    - value: "#6a5340"
  window_dark:
    - {when: night, value: "#121a33"}
    - value: "#a9cde3"
  glow_opacity:
    - {when: night, value: 0.85}
    - value: 0.25
  pool_opacity:
    - {when: night, value: 0.35}
    - value: 0
  smoke:
    - {when: night, value: "#8a90a3"}
    - value: "#f3f3f3"
  smoke_opacity: {signal: heating, range: [0.45, 1]}
  cloud:
    - {when: night, value: "#2b3146"}
    - {when: {signal: weather, is: storm}, value: "#4a5261"}
    - {when: {signal: weather, is: rain}, value: "#7b8693"}
    - {when: {signal: weather, in: [cloudy, snow]}, value: "#e1e6eb"}
    - value: "#ffffff"
  fence:
    - {when: night, value: "#4d4c5d"}
    - value: "#efe8da"
  pole:
    - {when: night, value: "#2b221e"}
    - value: "#6b4a32"
  wire:
    - {when: night, value: "#05050a"}
    - value: "#2a2a2a"
  visitor:
    - {when: night, value: "#0d0b12"}
    - value: "#2b2534"
  bin_color:
    - {when: {signal: bin, is: recycling}, value: "#2c6bd0"}
    - {when: {signal: bin, is: garden}, value: "#3e8e3a"}
    - {when: {signal: bin, is: food}, value: "#8b5a2b"}
    - value: "#3b4047"
  vignette:
    - {when: night, value: 0.55}
    - value: 0.22
  sway:
    - {when: {signal: weather, in: [wind, storm]}, value: sway}
    - value: still
  cloud_speed:
    - {when: {signal: weather, in: [wind, storm]}, value: 9s}
    - value: 50s

defs: |
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="{{ sky_top }}"/>
    <stop offset="1" stop-color="{{ sky_bottom }}"/>
  </linearGradient>
  <radialGradient id="lit" cx="0.5" cy="0.5" r="0.7">
    <stop offset="0" stop-color="#fff4c9"/>
    <stop offset="1" stop-color="#ffb84d"/>
  </radialGradient>
  <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.8">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="{{ vignette }}"/>
  </radialGradient>
  <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f4f1de" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#f4f1de" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <mask id="crescent">
    <rect x="1100" y="40" width="260" height="260" fill="#fff"/>
    <circle cx="1252" cy="152" r="44" fill="#000"/>
  </mask>
  <g id="cloud">
    <circle cx="50" cy="60" r="30"/>
    <circle cx="92" cy="42" r="40"/>
    <circle cx="138" cy="56" r="32"/>
    <circle cx="168" cy="70" r="20"/>
    <rect x="40" y="60" width="140" height="30" rx="15"/>
  </g>
  <pattern id="rain" width="120" height="120" patternUnits="userSpaceOnUse">
    <g stroke="#d6e6ff" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <line x1="10" y1="0" x2="4" y2="24"/>
      <line x1="50" y1="30" x2="44" y2="54"/>
      <line x1="90" y1="8" x2="84" y2="32"/>
      <line x1="30" y1="70" x2="24" y2="94"/>
      <line x1="75" y1="82" x2="69" y2="106"/>
      <line x1="112" y1="55" x2="106" y2="79"/>
    </g>
  </pattern>
  <pattern id="snow" width="120" height="120" patternUnits="userSpaceOnUse">
    <g fill="#fff">
      <circle cx="12" cy="10" r="3"/>
      <circle cx="70" cy="22" r="2.5"/>
      <circle cx="40" cy="58" r="3.5"/>
      <circle cx="100" cy="66" r="2.5"/>
      <circle cx="22" cy="98" r="2"/>
      <circle cx="84" cy="104" r="3"/>
    </g>
  </pattern>
  <pattern id="pickets" x="1100" y="726" width="26" height="70" patternUnits="userSpaceOnUse">
    <polygon points="7,12 13,3 19,12 19,66 7,66" fill="{{ fence }}"/>
  </pattern>

style: |
  .sway { animation: sway 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(3deg); } }
  .drift { animation: drift linear infinite alternate; }
  @keyframes drift { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: 0.25; } }
  .puff { transform-box: fill-box; transform-origin: center; animation: rise 6s ease-out infinite; opacity: 0; }
  @keyframes rise { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translate(70px, -200px) scale(2.4); opacity: 0; } }
  .flicker { animation: flicker 2.2s steps(1) infinite; }
  @keyframes flicker { 0% { fill: #5b7cff; } 18% { fill: #c9d6ff; } 31% { fill: #6c45e8; } 47% { fill: #3fa0ff; } 63% { fill: #eef3ff; } 79% { fill: #4b63d6; } }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.8s ease-out infinite; }
  @keyframes ring { from { transform: scale(1); opacity: 0.95; } to { transform: scale(4.5); opacity: 0; } }
  .trot { animation: trot 0.45s ease-in-out infinite alternate; }
  @keyframes trot { to { transform: translateY(-3px); } }
  .bob { animation: bob 3.2s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
  .flap { transform-box: fill-box; transform-origin: 50% 100%; animation: flap 0.35s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleY(-0.5); } }
  .fall { animation: fall 0.45s linear infinite; }
  .fall-fast { animation: fall 0.3s linear infinite; }
  .fall-slow { animation: fall 7s linear infinite; }
  .fall-mid { animation: fall 4.5s linear infinite; }
  @keyframes fall { from { transform: translateY(-120px); } to { transform: translateY(0); } }
  .flash { animation: flash 7s linear infinite; opacity: 0; }
  @keyframes flash { 0%, 61%, 63.5%, 65%, 100% { opacity: 0; } 62%, 64% { opacity: 1; } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  .spark { transform-box: fill-box; transform-origin: center; animation: spark 0.25s steps(2) infinite; }
  @keyframes spark { 50% { transform: scale(0.4) rotate(30deg); opacity: 0.5; } }
  .leaf { transform-box: fill-box; transform-origin: center; animation: blow 5s linear infinite; }
  @keyframes blow { from { transform: translate(-80px, 0) rotate(0deg); } to { transform: translate(1750px, 160px) rotate(900deg); } }
  .fog { animation: drift 24s ease-in-out infinite alternate; }
  .banner-text { font: 700 19px Georgia, 'Times New Roman', serif; fill: #7a2b1f; }
  .tag { font: 700 13px Helvetica, Arial, sans-serif; fill: #1d1d1d; }
  .tag-small { font: 700 8px Helvetica, Arial, sans-serif; fill: #1d1d1d; }

layers:
  - id: sky
    svg: <rect width="1600" height="900" fill="url(#sky)"/>

  - id: stars
    when: {all: [night, {signal: weather, in: [clear, partly, wind]}]}
    svg: |
      <g fill="#fffbe8">
        <circle cx="80" cy="60" r="1.6"/><circle cx="190" cy="120" r="1.2" class="twinkle"/>
        <circle cx="260" cy="40" r="2"/><circle cx="340" cy="210" r="1.3"/>
        <circle cx="420" cy="90" r="1.8" class="twinkle" style="animation-delay:-1s"/>
        <circle cx="530" cy="190" r="1.2"/><circle cx="610" cy="60" r="1.7"/>
        <circle cx="700" cy="230" r="1.3" class="twinkle" style="animation-delay:-2s"/>
        <circle cx="780" cy="110" r="2"/><circle cx="860" cy="40" r="1.2"/>
        <circle cx="930" cy="190" r="1.6" class="twinkle"/><circle cx="1010" cy="90" r="1.3"/>
        <circle cx="1090" cy="250" r="1.8"/><circle cx="1150" cy="60" r="1.2" class="twinkle" style="animation-delay:-1.5s"/>
        <circle cx="1350" cy="90" r="1.5"/><circle cx="1390" cy="230" r="1.2"/>
        <circle cx="1460" cy="50" r="2" class="twinkle" style="animation-delay:-0.5s"/>
        <circle cx="1530" cy="160" r="1.4"/><circle cx="1570" cy="300" r="1.2"/>
        <circle cx="150" cy="300" r="1.3"/><circle cx="470" cy="330" r="1.1"/>
        <circle cx="990" cy="320" r="1.2"/><circle cx="640" cy="350" r="1"/>
        <circle cx="1270" cy="330" r="1.3" class="twinkle" style="animation-delay:-2.5s"/>
      </g>

  - id: sun
    when: {all: ["!night", {signal: weather, in: [clear, partly, wind]}]}
    svg: |
      <circle cx="1230" cy="180" r="120" fill="url(#sunglow)"/>
      <circle cx="1230" cy="180" r="52" fill="#ffd45c"/>

  - id: moon
    when: {all: [night, {signal: weather, in: [clear, partly, wind]}]}
    svg: |
      <circle cx="1230" cy="170" r="110" fill="url(#moonglow)"/>
      <circle cx="1230" cy="170" r="46" fill="#f4f1de" mask="url(#crescent)"/>

  - id: sky_flash
    when: {signal: weather, is: storm}
    svg: <rect width="1600" height="900" fill="#e8ecff" opacity="0.35" class="flash"/>

  - id: clouds_light
    when: {signal: weather, in: [partly, wind]}
    svg: |
      <g fill="{{ cloud }}" opacity="0.95">
        <g class="drift" style="animation-duration:{{ cloud_speed }}"><use href="#cloud" transform="translate(140 220) scale(0.9)"/></g>
        <g class="drift" style="animation-duration:{{ cloud_speed }};animation-delay:-20s"><use href="#cloud" transform="translate(1080 210) scale(1.2)"/></g>
        <g class="drift" style="animation-duration:{{ cloud_speed }};animation-delay:-35s"><use href="#cloud" transform="translate(720 90) scale(0.7)"/></g>
      </g>

  - id: clouds_heavy
    when: {signal: weather, in: [cloudy, rain, storm, snow]}
    svg: |
      <g fill="{{ cloud }}">
        <g class="drift" style="animation-duration:{{ cloud_speed }}" opacity="0.8">
          <use href="#cloud" transform="translate(-60 150) scale(1.5)"/>
          <use href="#cloud" transform="translate(520 170) scale(1.4)"/>
          <use href="#cloud" transform="translate(1180 160) scale(1.6)"/>
        </g>
        <g class="drift" style="animation-duration:{{ cloud_speed }};animation-delay:-25s">
          <use href="#cloud" transform="translate(160 20) scale(2)"/>
          <use href="#cloud" transform="translate(800 0) scale(2.2)"/>
          <use href="#cloud" transform="translate(1340 40) scale(1.7)"/>
        </g>
      </g>

  - id: alert
    when: alert
    svg: |
      <g transform="translate(600 150)"><g class="bob">
        <line x1="-22" y1="4" x2="-52" y2="10" stroke="#7a2b1f" stroke-width="1.5"/>
        <path d="M-52,-12 L-500,-12 L-478,10 L-500,32 L-52,32 Z" fill="#fff8e7" stroke="#c94f3d" stroke-width="3"/>
        <text x="-270" y="16" text-anchor="middle" class="banner-text">{{ alert|truncate:34 }}</text>
        <polygon points="-22,-2 -42,-10 -42,8 -22,4" fill="#8e97a6"/>
        <ellipse cx="0" cy="0" rx="24" ry="11" fill="#a9b1bf"/>
        <circle cx="22" cy="-7" r="8" fill="#a9b1bf"/>
        <polygon points="29,-9 38,-6 29,-3" fill="#e0a030"/>
        <circle cx="24" cy="-8" r="1.6" fill="#222"/>
        <polygon points="-8,-4 10,-4 -14,-32" fill="#8e97a6" class="flap"/>
      </g></g>

  - id: far_hills
    svg: <path d="M0,540 C180,470 360,500 520,520 C700,545 860,470 1040,480 C1220,490 1400,530 1600,500 L1600,720 L0,720 Z" fill="{{ far_hill }}"/>

  - id: mid_hills
    svg: <path d="M0,620 C200,560 420,590 600,600 C820,612 1000,560 1200,575 C1380,588 1500,600 1600,590 L1600,730 L0,730 Z" fill="{{ mid_hill }}"/>

  - id: fog_far
    when: {signal: weather, is: fog}
    svg: |
      <rect width="1600" height="900" fill="#eef1f4" opacity="0.35"/>
      <g fill="#f4f6f8" opacity="0.6" class="fog"><ellipse cx="420" cy="555" rx="520" ry="38"/><ellipse cx="1250" cy="590" rx="600" ry="42"/></g>

  - id: ground
    svg: |
      <path d="M0,700 C300,680 600,690 800,700 C1000,710 1300,688 1600,700 L1600,900 L0,900 Z" fill="{{ ground }}"/>
      <polygon points="778,702 812,702 900,900 690,900" fill="{{ path_color }}"/>

  - id: trees
    svg: |
      <g fill="{{ trunk }}"><rect x="404" y="615" width="12" height="90"/><rect x="512" y="590" width="16" height="115"/><rect x="1165" y="640" width="12" height="66"/></g>
      <g class="{{ sway }}" style="animation-delay:-0.7s"><g fill="{{ tree_dark }}"><circle cx="410" cy="597" r="40"/><circle cx="388" cy="614" r="28"/><circle cx="432" cy="617" r="28"/></g></g>
      <g class="{{ sway }}"><g fill="{{ tree }}"><circle cx="520" cy="560" r="55"/><circle cx="488" cy="588" r="40"/><circle cx="554" cy="592" r="38"/></g></g>
      <g class="{{ sway }}" style="animation-delay:-1.3s"><g fill="{{ tree_dark }}"><polygon points="1171,515 1128,600 1214,600"/><polygon points="1171,552 1118,652 1224,652"/></g></g>

  - id: cottage
    svg: |
      <rect x="865" y="440" width="36" height="70" fill="{{ brick }}"/>
      <rect x="859" y="431" width="48" height="11" fill="{{ brick }}"/>
      <rect x="940" y="605" width="125" height="96" fill="{{ wall_shade }}"/>
      <polygon points="932,592 1075,612 1075,623 932,603" fill="{{ roof }}"/>
      <rect x="965" y="628" width="80" height="44" fill="{{ window_dark }}" stroke="{{ frame }}" stroke-width="4"/>
      <rect x="640" y="545" width="300" height="156" fill="{{ wall }}"/>
      <polygon points="618,550 790,418 962,550" fill="{{ roof }}"/>
      <polyline points="618,550 790,418 962,550" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="5"/>
      <circle cx="790" cy="492" r="22" fill="{{ window_dark }}" stroke="{{ frame }}" stroke-width="4"/>
      <path d="M768,492 H812 M790,470 V514" stroke="{{ frame }}" stroke-width="3"/>
      <g fill="{{ window_dark }}" stroke="{{ frame }}" stroke-width="4"><rect x="675" y="595" width="70" height="55"/><rect x="835" y="595" width="70" height="55"/></g>
      <path d="M710,595 V650 M675,622 H745 M870,595 V650 M835,622 H905" stroke="{{ frame }}" stroke-width="3"/>
      <g fill="{{ wall_shade }}"><rect x="670" y="650" width="80" height="7"/><rect x="830" y="650" width="80" height="7"/></g>
      <path d="M770,701 L770,640 A20,20 0 0 1 810,640 L810,701 Z" fill="{{ door }}"/>
      <circle cx="803" cy="670" r="2.5" fill="#d9a441"/>
      <rect x="818" y="606" width="9" height="12" fill="#3b3b3b"/>
      <circle cx="822.5" cy="622" r="4" fill="#77756f"/>
      <rect x="646" y="556" width="12" height="9" fill="#3b3b3b"/>

  - id: snow_caps
    when: {signal: weather, is: snow}
    svg: |
      <g fill="#fbfdff">
        <polygon points="616,551 790,416 964,551 952,556 790,432 628,556"/>
        <rect x="857" y="425" width="52" height="8" rx="4"/>
        <polygon points="930,590 1077,610 1077,616 930,597"/>
        <ellipse cx="520" cy="512" rx="40" ry="10"/><ellipse cx="410" cy="560" rx="28" ry="8"/>
      </g>

  - id: smoke
    when: heating
    svg: |
      <g fill="{{ smoke }}" opacity="{{ smoke_opacity }}">
        <circle cx="883" cy="420" r="14" class="puff"/>
        <circle cx="883" cy="420" r="14" class="puff" style="animation-delay:-2s"/>
        <circle cx="883" cy="420" r="14" class="puff" style="animation-delay:-4s"/>
      </g>

  - id: smoke_heavy
    when: {signal: heating, above: 0.5}
    svg: |
      <g fill="{{ smoke }}" opacity="{{ smoke_opacity }}">
        <circle cx="880" cy="420" r="18" class="puff" style="animation-delay:-1s"/>
        <circle cx="886" cy="420" r="16" class="puff" style="animation-delay:-3s"/>
        <circle cx="882" cy="420" r="18" class="puff" style="animation-delay:-5s"/>
      </g>

  - id: light_left
    when: lights
    svg: |
      <rect x="660" y="582" width="100" height="82" fill="#ffc861" opacity="{{ glow_opacity }}" filter="url(#blur)"/>
      <ellipse cx="710" cy="712" rx="70" ry="12" fill="#ffd27a" opacity="{{ pool_opacity }}" filter="url(#blur)"/>
      <rect x="675" y="595" width="70" height="55" fill="url(#lit)" stroke="{{ frame }}" stroke-width="4"/>
      <path d="M710,595 V650 M675,622 H745" stroke="{{ frame }}" stroke-width="3"/>

  - id: light_right
    when: {signal: lights, above: 0.34}
    svg: |
      <rect x="820" y="582" width="100" height="82" fill="#ffc861" opacity="{{ glow_opacity }}" filter="url(#blur)"/>
      <ellipse cx="870" cy="712" rx="70" ry="12" fill="#ffd27a" opacity="{{ pool_opacity }}" filter="url(#blur)"/>
      <rect x="835" y="595" width="70" height="55" fill="url(#lit)" stroke="{{ frame }}" stroke-width="4"/>
      <path d="M870,595 V650 M835,622 H905" stroke="{{ frame }}" stroke-width="3"/>

  - id: light_gable
    when: {signal: lights, above: 0.67}
    svg: |
      <circle cx="790" cy="492" r="36" fill="#ffc861" opacity="{{ glow_opacity }}" filter="url(#blur)"/>
      <circle cx="790" cy="492" r="22" fill="url(#lit)" stroke="{{ frame }}" stroke-width="4"/>
      <path d="M768,492 H812 M790,470 V514" stroke="{{ frame }}" stroke-width="3"/>

  - id: cinema
    when: cinema
    svg: |
      <rect x="950" y="615" width="110" height="70" fill="#6f8cff" opacity="{{ glow_opacity }}" filter="url(#blur)"/>
      <rect x="965" y="628" width="80" height="44" class="flicker" stroke="{{ frame }}" stroke-width="4"/>
      <g fill="#14121e"><path d="M980,672 a10,11 0 0 1 20,0 Z"/><path d="M1006,672 a11,13 0 0 1 22,0 Z"/></g>

  - id: motion
    when: motion
    svg: |
      <circle cx="652" cy="566" r="5" fill="#fff7c2"/>
      <g transform="translate(250 750) scale(1.3)"><g class="trot">
        <path d="M0,10 C-30,0 -55,-5 -72,10 C-55,22 -25,25 0,20 Z" fill="#e0702a"/>
        <path d="M-72,10 C-64,3 -56,5 -53,12 C-59,18 -66,17 -72,10 Z" fill="#fbf4ea"/>
        <g fill="#3a2418"><rect x="6" y="16" width="5" height="24"/><rect x="18" y="16" width="5" height="24"/><rect x="54" y="14" width="5" height="26"/><rect x="64" y="14" width="5" height="26"/></g>
        <path d="M-8,9 C4,-10 52,-14 70,-4 L72,18 C50,26 10,26 -8,19 Z" fill="#e0702a"/>
        <path d="M64,-4 L78,-26 L84,-11 L92,-24 L97,-5 L114,6 L97,13 L72,12 Z" fill="#e0702a"/>
        <path d="M96,3 L114,6 L98,13 Z" fill="#fbf4ea"/>
        <circle cx="114" cy="6" r="2.5" fill="#1d1410"/>
        <circle cx="92" cy="-3" r="2.2" fill="#1d1410"/>
      </g></g>

  - id: motion_night
    when: {all: [motion, night]}
    svg: |
      <polygon points="652,566 540,712 780,712" fill="#fff2b0" opacity="0.22"/>
      <circle cx="652" cy="566" r="22" fill="#fff2b0" opacity="0.5" filter="url(#blur)"/>
      <g transform="translate(250 750) scale(1.3)"><g class="trot"><circle cx="92" cy="-3" r="2.6" fill="#ffe46b"/></g></g>

  - id: doorbell
    when: doorbell
    svg: |
      <circle cx="822.5" cy="622" r="30" fill="#ffd27a" opacity="0.6" filter="url(#blur)"/>
      <circle cx="822.5" cy="622" r="4.5" fill="#ffe7a8"/>
      <g fill="none" stroke="#ffd27a" stroke-width="2.5">
        <circle cx="822.5" cy="622" r="9" class="ring" vector-effect="non-scaling-stroke"/>
        <circle cx="822.5" cy="622" r="9" class="ring" style="animation-delay:-0.6s" vector-effect="non-scaling-stroke"/>
        <circle cx="822.5" cy="622" r="9" class="ring" style="animation-delay:-1.2s" vector-effect="non-scaling-stroke"/>
      </g>
      <g fill="{{ visitor }}">
        <circle cx="757" cy="642" r="11"/>
        <path d="M740,716 L743,668 Q757,652 771,668 L774,716 Z"/>
      </g>

  - id: doorbell_umbrella
    when: {all: [doorbell, {signal: weather, in: [rain, storm]}]}
    svg: |
      <line x1="757" y1="624" x2="757" y2="664" stroke="#222" stroke-width="2"/>
      <path d="M723,628 A34,24 0 0 1 791,628 Z" fill="#c94f3d"/>

  - id: fence
    svg: |
      <g fill="{{ fence }}"><rect x="1100" y="746" width="500" height="7"/><rect x="1100" y="773" width="500" height="7"/></g>
      <rect x="1100" y="726" width="500" height="70" fill="url(#pickets)"/>

  - id: wheelie_bin
    when: {signal: bin, in: [general, recycling, garden]}
    svg: |
      <path d="M1225,746 L1295,746 L1290,846 L1230,846 Z" fill="{{ bin_color }}"/>
      <rect x="1219" y="734" width="82" height="15" rx="4" fill="{{ bin_color }}"/>
      <rect x="1219" y="734" width="82" height="15" rx="4" fill="#000" opacity="0.25"/>
      <circle cx="1290" cy="848" r="9" fill="#1e1e1e"/>
      <rect x="1231" y="764" width="58" height="34" rx="4" fill="#fdfdf8"/>
      <text x="1260" y="780" text-anchor="middle" class="tag">FRI</text>
      <text x="1260" y="792" text-anchor="middle" class="tag-small">{{ bin|upper }}</text>

  - id: food_caddy
    when: {signal: bin, is: food}
    svg: |
      <rect x="1232" y="800" width="52" height="46" rx="5" fill="{{ bin_color }}"/>
      <rect x="1228" y="794" width="60" height="10" rx="4" fill="#5e3c1c"/>
      <rect x="1240" y="810" width="36" height="26" rx="3" fill="#fdfdf8"/>
      <text x="1258" y="822" text-anchor="middle" class="tag" style="font-size:10px">FRI</text>
      <text x="1258" y="832" text-anchor="middle" class="tag-small" style="font-size:7px">FOOD</text>

  - id: pole
    svg: |
      <rect x="1444" y="430" width="12" height="368" fill="{{ pole }}"/>
      <rect x="1410" y="450" width="80" height="8" fill="{{ pole }}"/>
      <g fill="#d8d8d0"><rect x="1417" y="440" width="8" height="10"/><rect x="1475" y="440" width="8" height="10"/></g>

  - id: wire
    when: "!offline"
    svg: <path d="M1421,444 Q1190,560 958,548" fill="none" stroke="{{ wire }}" stroke-width="2"/>

  - id: bird
    when: {all: ["!offline", "!night", {signal: weather, in: [clear, partly, cloudy, fog]}]}
    svg: |
      <g fill="#2d2d38">
        <polygon points="1274,500 1262,506 1275,504"/>
        <ellipse cx="1283" cy="498" rx="10" ry="6.5"/>
        <circle cx="1292" cy="491" r="4.8"/>
        <polygon points="1296,490 1302,492 1296,493" fill="#e0a030"/>
      </g>

  - id: offline
    when: offline
    svg: |
      <path d="M1421,444 Q1404,520 1384,610" fill="none" stroke="{{ wire }}" stroke-width="2"/>
      <path d="M958,548 Q984,560 994,592" fill="none" stroke="{{ wire }}" stroke-width="2"/>
      <polygon points="1384,598 1388,607 1398,606 1390,613 1394,623 1384,617 1374,623 1378,613 1370,606 1380,607" fill="#ffe14d" class="spark"/>
      <circle cx="1450" cy="478" r="10" fill="#ff3b30" opacity="0.4" filter="url(#blur)" class="blink"/>
      <circle cx="1450" cy="478" r="5" fill="#ff3b30" class="blink"/>

  - id: fog_near
    when: {signal: weather, is: fog}
    svg: <g fill="#f4f6f8" opacity="0.5" class="fog" style="animation-delay:-9s"><ellipse cx="760" cy="735" rx="760" ry="55"/></g>

  - id: rain
    when: {signal: weather, in: [rain, storm]}
    svg: <g class="fall"><rect y="-120" width="1600" height="1140" fill="url(#rain)"/></g>

  - id: rain_heavy
    when: {signal: weather, is: storm}
    svg: <g class="fall-fast"><rect x="-60" y="-160" width="1720" height="1180" fill="url(#rain)" transform="translate(60 40)"/></g>

  - id: snow
    when: {signal: weather, is: snow}
    svg: |
      <g class="fall-slow"><rect y="-120" width="1600" height="1140" fill="url(#snow)"/></g>
      <g class="fall-mid" opacity="0.8"><rect y="-120" width="1600" height="1140" fill="url(#snow)" transform="translate(50 30)"/></g>

  - id: lightning
    when: {signal: weather, is: storm}
    svg: <polygon points="430,180 395,305 422,305 382,440 456,282 428,282 458,180" fill="#fffbd0" class="flash"/>

  - id: leaves
    when: {signal: weather, in: [wind, storm]}
    svg: |
      <g fill="#c9822f">
        <ellipse cx="0" cy="380" rx="11" ry="5" class="leaf"/>
        <ellipse cx="0" cy="520" rx="10" ry="4.5" class="leaf" style="animation-delay:-1.4s" fill="#9fb03a"/>
        <ellipse cx="0" cy="640" rx="11" ry="5" class="leaf" style="animation-delay:-2.6s"/>
        <ellipse cx="0" cy="300" rx="9" ry="4" class="leaf" style="animation-delay:-3.7s" fill="#d9a441"/>
        <ellipse cx="0" cy="760" rx="11" ry="5" class="leaf" style="animation-delay:-4.4s" fill="#9fb03a"/>
      </g>

  - id: vignette
    svg: <rect width="1600" height="900" fill="url(#vignette)"/>
