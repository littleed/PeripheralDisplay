        <path class="gust" pathLength="100" style="animation-delay:-0.9s" d="M40,150 C110,120 170,170 240,140 C290,118 330,90 300,66 C278,50 250,66 262,86 C270,98 290,94 292,82"/>
        <path class="gust" pathLength="100" style="animation-delay:-1.8s" d="M-40,620 C160,590 320,650 520,610 S800,560 980,620 C1040,640 1030,690 990,685 C955,680 960,645 985,645"/>
      </g>

  - id: art
    when: {signal: season, is: none}
    svg: <g transform="translate(-78 18) scale(0.866)"><use href="#art"/></g>

  - id: art_christmas
    when: {signal: season, is: christmas}
    svg: <g transform="translate(-78 18) scale(0.866)"><image x="100" y="15" width="1290" height="990" href="data:image/webp;base64,"/></g>

  - id: art_halloween
    when: {signal: season, is: halloween}
    svg: <g transform="translate(-78 18) scale(0.866)"><image x="100" y="15" width="1290" height="990" href="data:image/webp;base64,"/></g>

  - id: smoke
    when: heating
    svg: |
      <g transform="translate(-78 18) scale(0.866)"><g opacity="{{ smoke_opacity }}" fill="url(#puff)">
        <circle cx="969" cy="515" r="30" class="puff" style="animation-delay:-0.0s"/>
        <circle cx="973" cy="515" r="37" class="puff" style="animation-delay:-1.0s"/>
        <circle cx="969" cy="515" r="35" class="puff" style="animation-delay:-2.0s"/>
        <circle cx="973" cy="515" r="33" class="puff" style="animation-delay:-3.0s"/>
        <circle cx="969" cy="515" r="31" class="puff" style="animation-delay:-4.0s"/>
        <circle cx="973" cy="515" r="38" class="puff" style="animation-delay:-5.0s"/>
        <circle cx="969" cy="515" r="36" class="puff" style="animation-delay:-6.0s"/>
        <circle cx="973" cy="515" r="34" class="puff" style="animation-delay:-7.0s"/>
      </g></g>

  - id: smoke_heavy
    when: {signal: heating, above: 0.5}
    svg: |
      <g transform="translate(-78 18) scale(0.866)"><g opacity="{{ smoke_opacity }}" fill="url(#puff)">
        <circle cx="969" cy="515" r="40" class="puff" style="animation-delay:-0.5s"/>
        <circle cx="973" cy="515" r="47" class="puff" style="animation-delay:-1.5s"/>
        <circle cx="969" cy="515" r="45" class="puff" style="animation-delay:-2.5s"/>
        <circle cx="973" cy="515" r="43" class="puff" style="animation-delay:-3.5s"/>
        <circle cx="969" cy="515" r="41" class="puff" style="animation-delay:-4.5s"/>
        <circle cx="973" cy="515" r="48" class="puff" style="animation-delay:-5.5s"/>
        <circle cx="969" cy="515" r="46" class="puff" style="animation-delay:-6.5s"/>
        <circle cx="973" cy="515" r="44" class="puff" style="animation-delay:-7.5s"/>
      </g></g>

  - id: front_door
    when: doorbell
    svg: |
      <g transform="translate(-78 18) scale(0.866)">
