  - id: sky_flash
    when: {signal: weather, is: storm}
    svg: <rect x="{{ view.x }}" y="{{ view.y }}" width="{{ view.width }}" height="{{ view.height }}" fill="#efe9ff" opacity="0.4" class="flash"/>

  - id: clouds_white
    when: {all: ["!night", {signal: weather, in: [partly, cloudy, snow]}]}
    svg: <g class="drift"><use href="#c_white" transform="translate(-40 -10) scale(1.05)"/></g>

  - id: cloud_bank_white
    when: {all: ["!night", {signal: weather, in: [partly, wind, cloudy, snow]}]}
    svg: <g class="drift" style="animation-delay:-17s"><use href="#c_bank" transform="translate(1080 88)"/></g>

  - id: clouds_grey
    when: {all: ["!night", {signal: weather, in: [cloudy, snow]}]}
    svg: |
      <g class="drift" style="animation-delay:-9s"><use href="#c_bank" transform="translate(700 70) scale(0.8)"/></g>
      <g class="drift" style="animation-delay:-28s"><use href="#c_white" transform="translate(1340 -60) scale(0.9)"/></g>

  - id: clouds_dark
    when: {any: [{signal: weather, in: [rain, storm]}, {all: [night, {signal: weather, in: [cloudy, snow]}]}]}
    svg: |
      <g class="drift"><use href="#c_dark" transform="translate(-50 -40) scale(1.05)"/></g>
