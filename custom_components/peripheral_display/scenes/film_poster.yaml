    when: {any: [{signal: weather, in: [rain, storm]}, {all: [night, {signal: weather, in: [partly, wind, cloudy, snow]}]}]}
    svg: <g class="drift" style="animation-delay:-17s"><use href="#c_darkbank" transform="translate(1080 80)"/></g>

  - id: lightning
    when: {signal: weather, is: storm}
    svg: |
      <polygon points="1075,300 1030,398 1060,398 1004,530 1098,372 1068,372 1108,300" fill="#2a0f12" transform="translate(6 6)"/>
      <polygon points="1075,300 1030,398 1060,398 1004,530 1098,372 1068,372 1108,300" fill="#fff6c2" stroke="#2a0f12" stroke-width="3.5"/>
