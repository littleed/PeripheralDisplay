# "The Stranger at the Door": a 1946 half-sheet film poster whose details
# follow the home.
#
#   weather  -> the poster's colour, a weather emblem worked into the title
#               (sunburst, clouds, rain, lightning, snowflakes, fog, wind) and
#               the tagline; rain, snow, fog and wind across the picture
#   night    -> a night-blue poster with a crescent moon and stars
#   doorbell -> the red front door swings open on a shadowy figure
#   side_door-> the green side door swings open on another figure
#   heating  -> the steam train smokes, more heavily with more heating
#   cinema   -> a studio camera on the lawn, its reels turning
#   season   -> holiday editions of the painting: at Christmas the stars wear
#               a fur-trimmed cape and a snowy fedora by a snowy house; at
#               Halloween they become a scream queen and a vampire count
#
# The painted artwork (people, house, train, camera and clouds) is embedded
# as WebP in defs, at the end of the file, with the lettering as outlines
# (from Anton, Oswald, Playfair Display, Yesteryear and Limelight, all under
# the SIL Open Font License) so the poster looks the same on every screen.
# Doors, smokestack and the camera's reels are drawn in the pixels of the
# picture they belong to.
schema: peripheral-display/scene@1
id: film_poster
name: The Stranger at the Door (golden-age film poster)
description: A 1940s Hollywood half-sheet poster whose weather, doors, steam train and camera follow the home.
author: Peripheral Display
canvas: {width: 1600, height: 900}

signals:
  weather:
    type: enum
    label: Weather
    description: The poster's colour, weather emblem and tagline follow a weather entity's condition.
    options: [clear, partly, cloudy, rain, storm, snow, fog, wind]
    bind:
      source: map
      domains: [weather]
      map:
        clear: [sunny, clear-night]
        partly: [partlycloudy]
        cloudy: [cloudy, exceptional]
        rain: [rainy, pouring]
        storm: [lightning, lightning-rainy]
        snow: [snowy, snowy-rainy, hail]
        fog: [fog]
        wind: [windy, windy-variant]
  night:
    type: boolean
    label: Night
    description: A night-blue poster with the moon and stars.
    bind:
      source: state
      domains: [sun, binary_sensor, input_boolean]
      entities: [sun.sun]
      match: [below_horizon, "on"]
  doorbell:
    type: boolean
    label: Doorbell
    description: The front door opens on a shadowy figure for a minute after a ring.
    bind:
      source: state
      domains: [binary_sensor, event, sensor]
      hold: 60
  side_door:
    type: boolean
    label: Side door
    description: The side door opens on a shadowy figure for a minute after it is triggered.
    bind:
      source: state
      domains: [binary_sensor, event, sensor]
      hold: 60
  heating:
    type: level
    label: Heating
    description: Smoke from the steam train; heavier as more of the heating is running.
    bind:
      source: state
      domains: [climate]
      attribute: hvac_action
      match: [heating]
  cinema:
    type: boolean
    label: Cinema
    description: A studio camera appears, its reels turning, while media plays.
    bind:
      source: state
      domains: [media_player]
      match: [playing]
  season:
    type: enum
    label: Season
    description: The stars' holiday editions; Christmas through December, Halloween from 24 October to 7 November.
    options: [none, halloween, christmas]
    bind:
      source: template
      template: >-
        {% set d = now() %}{% if d.month == 12 %}christmas{% elif (d.month == 10 and d.day >= 24)
        or (d.month == 11 and d.day <= 7) %}halloween{% else %}none{% endif %}

vars:
  field_top:
    - {when: {all: [night, {signal: weather, in: [clear, partly, wind]}]}, value: "#0a1033"}
    - {when: night, value: "#181c2a"}
    - {when: {signal: weather, is: storm}, value: "#2b2036"}
    - {when: {signal: weather, is: rain}, value: "#34536b"}
    - {when: {signal: weather, is: cloudy}, value: "#5f7484"}
    - {when: {signal: weather, is: snow}, value: "#7ea7c8"}
    - {when: {signal: weather, is: fog}, value: "#8f8d9c"}
    - {when: {signal: weather, is: wind}, value: "#2f7c79"}
    - {when: {signal: weather, is: partly}, value: "#3d8cc0"}
    - value: "#f6c02c"
  field_bottom:
    - {when: {all: [night, {signal: weather, in: [clear, partly, wind]}]}, value: "#2c2357"}
    - {when: night, value: "#3a3e4f"}
    - {when: {signal: weather, is: storm}, value: "#6a4658"}
    - {when: {signal: weather, is: rain}, value: "#93a9b0"}
    - {when: {signal: weather, is: cloudy}, value: "#c4bfae"}
    - {when: {signal: weather, is: snow}, value: "#e3ebee"}
    - {when: {signal: weather, is: fog}, value: "#dcd3c2"}
    - {when: {signal: weather, is: wind}, value: "#e6cf95"}
    - {when: {signal: weather, is: partly}, value: "#f0d59a"}
    - value: "#e8742a"
  ray:
    - {when: night, value: "#c9c3ff"}
    - value: "#fff4c4"
  ink:
    - {when: {any: [night, {signal: weather, in: [rain, storm]}]}, value: "#f7ecd0"}
    - value: "#3a120d"
  ink_shadow:
    - {when: {any: [night, {signal: weather, in: [rain, storm]}]}, value: "#120a0c"}
    - value: "#f8e8bf"
  smoke:
    - {when: night, value: "#9aa0b8"}
    - value: "#f2ece2"
  smoke_shade:
    - {when: night, value: "#4c5068"}
    - value: "#a99f95"
  smoke_opacity: {signal: heating, range: [0.7, 1]}
  spill:
    - {when: night, value: 0.9}
    - value: 0.55

style: |
  .twinkle { animation: twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: 0.25; } }
  .turn { transform-box: view-box; animation: turn 60s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .drift { animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
  .puff { transform-box: fill-box; transform-origin: center; animation: puff 8s linear infinite; opacity: 0; }
  @keyframes puff { 0% { transform: translate(0, 0) scale(0.4); opacity: 0; } 6% { opacity: 1; } 25% { transform: translate(30px, -95px) scale(1.5); } 60% { transform: translate(180px, -165px) scale(2.6); opacity: 0.8; } 100% { transform: translate(380px, -210px) scale(3.8); opacity: 0; } }
  .swing { animation: swing 1.6s cubic-bezier(.45,.05,.3,1) 0.5s both; }
  @keyframes swing { from { transform: scaleX(1); } to { transform: scaleX(0.16); } }
  .shade { animation: shade 1.6s ease-in 0.5s both; }
  @keyframes shade { from { opacity: 0; } to { opacity: 0.7; } }
  .reveal { animation: reveal 1.6s ease-in 0.5s both; }
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
  .appear { animation: reveal 0.8s ease-out both; }
  .spin { animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fall { animation: fall 0.55s linear infinite; }
  .fall-fast { animation: fall 0.32s linear infinite; }
  @keyframes fall { from { transform: translate(52px, -210px); } to { transform: translate(0, 0); } }
  .snowfall { animation: snowfall 8s linear infinite; }
  .snowfall-mid { animation: snowfall 5s linear infinite; }
  @keyframes snowfall { from { transform: translateY(-140px); } to { transform: translateY(0); } }
  .flash { animation: flash 7s linear infinite; opacity: 0; }
  @keyframes flash { 0%, 61%, 63.5%, 65%, 100% { opacity: 0; } 62%, 64% { opacity: 1; } }
  .fog { animation: drift 22s ease-in-out infinite alternate; }
  .gust { fill: none; stroke-dasharray: 30 200; animation: gust 2.8s ease-in infinite; }
  @keyframes gust { 0% { stroke-dashoffset: 30; opacity: 0; } 15% { opacity: 0.9; } 85% { opacity: 0.9; } 100% { stroke-dashoffset: -100; opacity: 0; } }
  .leaf { transform-box: fill-box; transform-origin: center; animation: blow 7s linear infinite; }
  @keyframes blow { from { transform: translate(-500px, -60px) rotate(0deg); } to { transform: translate(2200px, 160px) rotate(1300deg); } }
  .fine { font: 600 8.5px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #4a3a28; letter-spacing: 0.2px; }
  .nss { font: 700 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #3a2a1a; }

layers:
  - id: field
    svg: <rect x="{{ view.x }}" y="{{ view.y }}" width="{{ view.width }}" height="{{ view.height }}" fill="url(#field)"/>

  - id: stars
    when: {all: [night, {signal: weather, in: [clear, partly, wind]}]}
    svg: |
      <g fill="#fff6d8">
        <circle cx="820" cy="120" r="1.8"/><circle cx="905" cy="60" r="1.4" class="twinkle"/><circle cx="1010" cy="140" r="2"/>
        <circle cx="1100" cy="52" r="1.3"/><circle cx="1290" cy="70" r="1.7" class="twinkle" style="animation-delay:-1s"/>
        <circle cx="1400" cy="150" r="1.4"/><circle cx="1500" cy="60" r="2" class="twinkle" style="animation-delay:-2s"/>
        <circle cx="1560" cy="200" r="1.3"/><circle cx="1530" cy="420" r="1.6"/><circle cx="1210" cy="500" r="1.4" class="twinkle"/>
        <circle cx="1450" cy="470" r="1.2"/><circle cx="960" cy="230" r="1.2"/><circle cx="120" cy="60" r="1.6"/>
        <circle cx="300" cy="40" r="1.3" class="twinkle" style="animation-delay:-1.6s"/><circle cx="60" cy="300" r="1.5"/>
        <circle cx="40" cy="560" r="1.2"/><circle cx="1580" cy="640" r="1.4" class="twinkle"/><circle cx="-60" cy="120" r="1.5"/>
        <circle cx="1680" cy="90" r="1.5"/><circle cx="1720" cy="330" r="1.2" class="twinkle"/><circle cx="-120" cy="400" r="1.4"/>
      </g>
      <g fill="#fff6d8"><path d="M1336,96 l3,-12 l3,12 l12,3 l-12,3 l-3,12 l-3,-12 l-12,-3 Z" class="twinkle"/>
      <path d="M884,190 l2,-8 l2,8 l8,2 l-8,2 l-2,8 l-2,-8 l-8,-2 Z" class="twinkle" style="animation-delay:-1.4s"/></g>

  - id: sunburst
    when: {all: ["!night", {signal: weather, is: clear}]}
    svg: |
      <g fill="{{ ray }}" opacity="0.4"><g class="turn" style="transform-origin:1190px 240px"><path d="M1190,240 L3790,240 L3774,531 Z M1190,240 L3725,819 L3644,1099 Z M1190,240 L3533,1368 L3391,1623 Z M1190,240 L3223,1861 L3028,2078 Z M1190,240 L2811,2273 L2573,2441 Z M1190,240 L2318,2583 L2049,2694 Z M1190,240 L1769,2775 L1481,2824 Z M1190,240 L1190,2840 L899,2824 Z M1190,240 L611,2775 L331,2694 Z M1190,240 L62,2583 L-193,2441 Z M1190,240 L-431,2273 L-648,2078 Z M1190,240 L-843,1861 L-1011,1623 Z M1190,240 L-1153,1368 L-1264,1099 Z M1190,240 L-1345,819 L-1394,531 Z M1190,240 L-1410,240 L-1394,-51 Z M1190,240 L-1345,-339 L-1264,-619 Z M1190,240 L-1153,-888 L-1011,-1143 Z M1190,240 L-843,-1381 L-648,-1598 Z M1190,240 L-431,-1793 L-193,-1961 Z M1190,240 L62,-2103 L331,-2214 Z M1190,240 L611,-2295 L899,-2344 Z M1190,240 L1190,-2360 L1481,-2344 Z M1190,240 L1769,-2295 L2049,-2214 Z M1190,240 L2318,-2103 L2573,-1961 Z M1190,240 L2811,-1793 L3028,-1598 Z M1190,240 L3223,-1381 L3391,-1143 Z M1190,240 L3533,-888 L3644,-619 Z M1190,240 L3725,-339 L3774,-51 Z"/></g></g>
      <circle cx="1190" cy="240" r="260" fill="url(#glow)"/>
      <circle cx="1190" cy="240" r="128" fill="url(#sun)" stroke="#c4561c" stroke-width="5"/>

  - id: sun_peeking
    when: {all: ["!night", {signal: weather, in: [partly, wind]}]}
    svg: |
      <g fill="{{ ray }}" opacity="0.32"><g class="turn" style="transform-origin:1400px 150px"><path d="M1400,150 L4000,150 L3978,489 Z M1400,150 L3911,823 L3802,1145 Z M1400,150 L3652,1450 L3463,1733 Z M1400,150 L3238,1988 L2983,2213 Z M1400,150 L2700,2402 L2395,2552 Z M1400,150 L2073,2661 L1739,2728 Z M1400,150 L1400,2750 L1061,2728 Z M1400,150 L727,2661 L405,2552 Z M1400,150 L100,2402 L-183,2213 Z M1400,150 L-438,1988 L-663,1733 Z M1400,150 L-852,1450 L-1002,1145 Z M1400,150 L-1111,823 L-1178,489 Z M1400,150 L-1200,150 L-1178,-189 Z M1400,150 L-1111,-523 L-1002,-845 Z M1400,150 L-852,-1150 L-663,-1433 Z M1400,150 L-438,-1688 L-183,-1913 Z M1400,150 L100,-2102 L405,-2252 Z M1400,150 L727,-2361 L1061,-2428 Z M1400,150 L1400,-2450 L1739,-2428 Z M1400,150 L2073,-2361 L2395,-2252 Z M1400,150 L2700,-2102 L2983,-1913 Z M1400,150 L3238,-1688 L3463,-1433 Z M1400,150 L3652,-1150 L3802,-845 Z M1400,150 L3911,-523 L3978,-189 Z"/></g></g>
      <circle cx="1400" cy="150" r="190" fill="url(#glow)"/>
      <circle cx="1400" cy="150" r="88" fill="url(#sun)" stroke="#c4561c" stroke-width="5"/>

  - id: moon
    when: {all: [night, {signal: weather, in: [clear, partly, wind]}]}
    svg: |
      <g fill="{{ ray }}" opacity="0.07"><path d="M170,112 L2770,112 L2754,403 Z M170,112 L2705,691 L2624,971 Z M170,112 L2513,1240 L2371,1495 Z M170,112 L2203,1733 L2008,1950 Z M170,112 L1791,2145 L1553,2313 Z M170,112 L1298,2455 L1029,2566 Z M170,112 L749,2647 L461,2696 Z M170,112 L170,2712 L-121,2696 Z M170,112 L-409,2647 L-689,2566 Z M170,112 L-958,2455 L-1213,2313 Z M170,112 L-1451,2145 L-1668,1950 Z M170,112 L-1863,1733 L-2031,1495 Z M170,112 L-2173,1240 L-2284,971 Z M170,112 L-2365,691 L-2414,403 Z M170,112 L-2430,112 L-2414,-179 Z M170,112 L-2365,-467 L-2284,-747 Z M170,112 L-2173,-1016 L-2031,-1271 Z M170,112 L-1863,-1509 L-1668,-1726 Z M170,112 L-1451,-1921 L-1213,-2089 Z M170,112 L-958,-2231 L-689,-2342 Z M170,112 L-409,-2423 L-121,-2472 Z M170,112 L170,-2488 L461,-2472 Z M170,112 L749,-2423 L1029,-2342 Z M170,112 L1298,-2231 L1553,-2089 Z M170,112 L1791,-1921 L2008,-1726 Z M170,112 L2203,-1509 L2371,-1271 Z M170,112 L2513,-1016 L2624,-747 Z M170,112 L2705,-467 L2754,-179 Z"/></g>
      <circle cx="170" cy="112" r="170" fill="url(#glow)" opacity="0.7"/>
